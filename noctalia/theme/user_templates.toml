[theme.templates.user.btop]
input_path = 'templates/btop.theme'
output_path = '$XDG_CONFIG_HOME/btop/themes/matugen.theme'
post_hook = 'pkill -USR2 btop || true'

[theme.templates.user.spicetify_text]
input_path = 'templates/spicetify.ini'
output_path = '$XDG_CONFIG_HOME/spicetify/Themes/text/color.ini'

[theme.templates.user.spicetify_sleek]
input_path = 'templates/spicetify-sleek.ini'
output_path = '$XDG_CONFIG_HOME/spicetify/Themes/Sleek/color.ini'

[theme.templates.user.spicetify_marketplace]
input_path = 'templates/spicetify.ini'
output_path = '$XDG_CONFIG_HOME/spicetify/Themes/marketplace/color.ini'

[theme.templates.user.zathura]
input_path = "templates/zathura"
output_path = '$XDG_CONFIG_HOME/zathura/zathurarc'

[theme.templates.user.rmpc]
input_path = '~/.config/matugen/templates/rmpc.ron'
output_path = '~/.config/rmpc/themes/matugen.ron'

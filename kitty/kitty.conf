include                             $HOME/.config/kitty/dank-tabs.conf
include                             $HOME/.config/kitty/dank-theme.conf

font_family                         Maple Mono 
background_blur                     1
font_size                           10.5
bold_font                           Maple Mono ExtraBold
italic_font                         Maple Mono Italic
bold_italic_font                    auto
cursor_shape                        block
cursor_blink_interval               0
cursor_stop_blinking_after          0
scrollback_lines                    5000
scrollback_indicator_opacity        0
wheel_scroll_min_lines              1
touch_scroll_multiplier             4
enable_audio_bell                   no
window_padding_width                10
hide_window_decorations             yes
background_opacity                  0.4
dynamic_background_opacity          yes
confirm_os_window_close             0
# selection_foreground                none
# selection_background                none
sync_to_monitor                     no
wayland_enable_ime                  no
enabled_layouts                     tall

# binds 
map alt+enter new_window
map alt+h previous_window
map alt+l next_window
map alt+w close_window
map alt+t new_tab
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab
map alt+up scroll_line_up smooth
map alt+down scroll_line_down smooth
map alt+k scroll_line_up smooth
map alt+j scroll_line_down smooth
map alt+f scroll_page_down
map alt+b scroll_page_up
map alt+minus change_font_size all -1.0
map alt+equal change_font_size all +1.0

# includes
include themes/noctalia.conf

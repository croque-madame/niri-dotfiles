[mgr]
linemode = "none"
show_hidden = true

[opener]
play = [{ run = "mpv %s", orhpan = true }, { run = "vlc %S", orhpan = true }]
txt_edit = [
    { run = "nvim %s", desc = "nvim", block = true },
    { run = "vim %s", desc = "vim", block = true },
]
img_view = [
    { run = "zathura %s", desc = "Zathura", orphan = true },
    { run = "zen-browser %S", desc = "Zen Browser", orphan = true },
    { run = "firefox %S", desc = "Firefox", orphan = true },
]
img_edit = [{ run = "gimp %S", desc = "Edit in GIMP", orphan = true }]
wine_run = [{ run = "wine %s", desc = "Run via WINE", orphan = true }]
xdg-open = [{ run = "xdg-open %s", desc = "xdg-open" }]
archive = [
    { run = 'cd %d && tar -cf "$(basename "%s").tar" "$(basename "%s")"', desc = "Archive to tar" },
    { run = 'cd %d && tar -czf "$(basename "%s").tar.gz" "$(basename "%s")"', desc = "Compress to tar.gz" },
    { run = 'cd %d && zip -r "$(basename "%s").zip" "$(basename "%s")"', desc = "Compress to zip" },
    { run = 'cd %d && 7z a "$(basename "%s").7z" "$(basename "%s")"', desc = "Compress to 7zip" },
]

[open]
prepend_rules = [
    { mime = "video/*", use = "play" },
    { mime = "text/*", use = "txt_edit" },
    { mime = "inode/empty", use = "txt_edit" },
    { mime = "image/*", use = [
        "img_view",
        "img_edit",
    ] },
    { mime = "application/pdf", use = "img_view" },
    { mime = "application/microsoft.*", use = "wine_run" },
    { mime = "{folder/*,inode/directory}", use = [
        "xdg-open",
        "archive",
    ] },
]
append_rules = [{ url = "*", use = "xdg-open" }]

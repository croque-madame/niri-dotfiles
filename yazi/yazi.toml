[mgr]
linemode = "none"

[opener]
play = [{ run = "mpv %s", orhpan = true }, { run = "vlc %S", orhpan = true }]
edit = [
    { run = "nvim %s", desc = "nvim", block = true },
    { run = "vim %s", desc = "vim", block = true },
]

[open]
prepend_rules = []
append_rules = [
    { mime = "video/*", use = "play" },
    { mime = "text/*", use = "edit" },
    { mime = "inode/empty", use = "edit" },
]
rules = []
